.setup{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.setup input{background:#0e1420;border:1px solid #1a2435;color:#b0b8c2;padding:8px 12px;border-radius:6px;font-family:inherit;font-size:13px}

.setup .uid-in{width:200px}.setup .date-in{width:170px}
.setup .btn{background:#e2b93b;color:#090d14;border:none;padding:8px 22px;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit}
.setup .btn:hover{opacity:.85}
.drop{text-align:center;padding:24px;border:2px dashed #1a2435;border-radius:10px;margin-bottom:18px;color:#5a6370;font-size:13px;transition:all .2s;cursor:pointer}
.drop:hover,.drop.dragover{border-color:#e2b93b;color:#8b94a0;background:rgba(226,185,59,.03)}
.drop.loaded{border-color:#4ade80;color:#4ade80;background:rgba(74,222,128,.04)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.card{background:#0e1420;border:1px solid #1a2435;border-radius:8px;padding:16px 12px;text-align:center;transition:border-color .2s}
.card:hover{border-color:#263248}
.card .label{font-size:10px;color:#5a6370;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.card .value{font-size:20px;font-weight:700}
.card.gold .value{color:#e2b93b}.card.green .value{color:#4ade80}.card.red .value{color:#f87171}.card.blue .value{color:#60a5fa}
.rate-toggle{cursor:pointer;opacity:.55;font-size:.85em;transition:opacity .2s,color .2s;user-select:none}.rate-toggle:hover{opacity:1;color:#60a5fa}
.clickable{cursor:pointer;user-select:none}.clickable:hover{border-color:#e2b93b!important}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.controls button{background:transparent;color:#6b7380;border:1px solid #1a2435;padding:8px 18px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border-radius:6px}
.controls button:hover{color:#b0b8c2;border-color:#263248}
.controls button.active{background:#e2b93b;color:#090d14;font-weight:700;border-color:#e2b93b}
.controls .limit-in{width:60px;text-align:center;color:#b0b8c2;background:#0e1420}
.controls .sep{color:#2a3340}
.controls label{color:#6b7380;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.controls .map-chip{opacity:.4;padding:4px 10px;font-size:11px}
.controls .map-chip.active{opacity:1}
.table-wrap{border:1px solid #1a2435;border-radius:8px;overflow:hidden;max-height:70vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0c1220;color:#5a6370;padding:10px 8px;text-align:center;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1a2435;position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #111826;text-align:center;color:#9ba3ae;white-space:nowrap}

.show-bg .win-row td{background:rgba(74,222,128,.10)}

.winner-me{color:#4ade80;font-weight:600}.winner-other{color:#6b7380}
.bid-detail{font-size:11px;color:#4b5460;line-height:1.5}
.profit-pos{color:#4ade80;font-weight:700}.profit-neg{color:#f87171;font-weight:700}.profit-zero{color:#5a6370}
.footer{text-align:center;margin-top:18px;color:#2a3340;font-size:11px}
.hidden{display:none}.nodata{text-align:center;padding:60px;color:#3a4350;font-size:14px}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:100;justify-content:center;align-items:center}

.dr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #141c28;font-size:14px;color:#9ba3ae}

.dr .pos{color:#4ade80}.dr .neg{color:#f87171}

<body>
<div class="container">
<div class="header"><h1>BidKing 竞拍盈亏</h1><p class="meta" id="meta">拖入 Player.log · 输入 UID · 开始解析</p></div>

<div class="setup">
  <select class="uid-in" id="uidSelect" style="width:200px;background:#0e1420;border:1px solid #1a2435;color:#b0b8c2;padding:8px 12px;border-radius:6px;font-family:inherit;font-size:13px" onchange="onUidChange()"><option value="">-- 自动识别中 --</option></select>
  <input class="date-in" id="dateInput" type="date" value="2026-05-10">
  <span style="color:#5a6370;font-size:12px">23:00 起</span>
  <button class="btn" onclick="parseLog()">解析</button>
</div>

<div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
  拖拽 Player.log 到此处 或 点击选择文件（可多选合并）
  <input type="file" id="fileInput" accept="*" hidden multiple>
</div>

<div id="resultArea" class="hidden">
<div class="summary">
  <div class="card gold"><div class="label">总场次</div><div class="value" id="sumN">-</div></div>
  <div class="card green"><div class="label">拍到了</div><div class="value" id="sumW">-</div></div>
  <div class="card red"><div class="label">未拍到</div><div class="value" id="sumL">-</div></div>
  <div class="card blue"><div class="label" id="rateLabelStandalone">拿仓率 <span class="rate-toggle" id="rateToggleStandalone" title="切换盈亏率" onclick="toggleRateStandalone()">⇌</span></div><div class="value" id="sumRate">-</div></div>
  <div class="card green clickable" id="profitCard" onclick="toggleDetail()"><div class="label">合计盈亏 ▾</div><div class="value" id="sumProfit">-</div></div>
</div>

<div class="controls">
  <button id="btnAll" class="active" onclick="showAll()">全部记录</button>
  <button id="btnWin" onclick="showWin()">仅显示拍到的</button>
  <span class="sep">|</span>
  <button class="map-chip active" data-mprefix="21" onclick="toggleMap(this)">快递</button>
  <button class="map-chip active" data-mprefix="22" onclick="toggleMap(this)">仓库</button>
  <button class="map-chip active" data-mprefix="23" onclick="toggleMap(this)">集装箱</button>
  <button class="map-chip active" data-mprefix="24" onclick="toggleMap(this)">别墅</button>
  <button class="map-chip active" data-mprefix="25" onclick="toggleMap(this)">残骸</button>
  <button class="map-chip active" data-mprefix="26" onclick="toggleMap(this)">拍卖会</button>
  <button class="map-chip active" data-mprefix="56" onclick="toggleMap(this)">竞拍之巅</button>
  <span class="sep">|</span><span style="color:#5a6370;font-size:12px">最近</span>
  <input class="limit-in" id="limitN" type="number" min="1" value="50" onchange="applyLimit()">
  <span style="color:#5a6370;font-size:12px">场</span>
</div>

<div class=table-wrap>
<table class="show-bg" id="mainTable">
<thead><tr>
  <th>时间</th><th>回合</th><th>地图</th><th>赢家</th>
  <th style="text-align:left">道具</th><th>我的出价</th><th>赢家出价</th><th>总价值</th><th>盈亏</th>
</tr></thead>
<tbody id="tableBody"><tr><td colspan="9" class="nodata">请拖入 Player.log 后点击解析</td></tr></tbody>
</table>
</div>
<p class="footer" id="footerInfo"></p>
</div>

<div class="overlay" id="overlay" onclick="toggleDetail()">
  <div class="dbox" onclick="event.stopPropagation()">
    <h3>盈亏明细</h3>
    <div class="dr"><span>拍到容器总价值 (<span id="dW">-</span>局)</span><span class="pos" id="dVal">-</span></div>
    <div class="dr"><span>出价支出 (<span id="dBidW">-</span>局)</span><span class="neg" id="dBid">-</span></div>
    <div class="dr"><span>道具成本 (<span id="dItemN">-</span>局)</span><span class="neg" id="dItem">-</span></div>
    <div class="dr" style="cursor:pointer" onclick="var d=document.getElementById('dTicketDetail');d.style.display=d.style.display==='none'?'block':'none'"><span>门票支出 ▾</span><span class="neg" id="dTick">-</span></div>
    <div id="dTicketDetail" style="display:none;font-size:12px;color:#6b7380;padding:4px 12px 8px;border-bottom:1px solid #141c28"></div>
    <div class="dr"><span>分红返还</span><span class="pos" id="dDiv">-</span></div>
    <div class="dr"><span>合计</span><span id="dTotal">-</span></div>
    <button class="dclose" onclick="toggleDetail()">关闭</button>
  </div>
</div>
</div>

function handleFile(file){
  if(!file)return;
  var mb=file.size/1048576;
  if(mb>500){if(!confirm('文件 '+mb.toFixed(0)+'MB 过大，浏览器可能崩溃。建议用 Python 版。继续？'))return}
  if(mb>200)dz.textContent='大文件('+mb.toFixed(0)+'MB)，解析中请等待...';
  var r=new FileReader();
  r.onload=function(){
    var exist=loadedFiles.find(function(f){return f.name===file.name});
    if(exist){exist.content=r.result;exist.size=file.size}else loadedFiles.push({name:file.name,size:file.size,content:r.result});
    window.logContent=loadedFiles.map(function(f){return f.content}).join('\n');
    var total=loadedFiles.reduce(function(s,f){return s+f.size},0);
    dz.textContent='已加载: '+loadedFiles.map(function(f){return f.name}).join(' + ')+' ('+(total/1048576).toFixed(1)+'MB) -> 解析中...';
    dz.classList.add('loaded');
    scanPlayers();
    setTimeout(parseLog,100);
  };
  r.readAsText(file);
}

function scanPlayers(){
  if(!window.logContent)return;
  var text=window.logContent;
  var marker='(S2C_89_get_game_log_list)';
  var mi=text.indexOf(marker);
  var players={};
  if(mi>=0){
    var s=text.indexOf('{',mi), depth=0,i=s;
    for(;i<text.length;i++){var c=text[i];if(c==='{')depth++;else if(c==='}'){depth--;if(depth===0)break;}}
    try{
      var list=JSON.parse(text.substring(s,i+1)).GameLogList||[];
      for(var k=0;k<list.length;k++){
        var ul=list[k].LogGameUserList||[];
        for(var j=0;j<ul.length;j++){var u=ul[j];if(!players[u.UserUid])players[u.UserUid]={cnt:0,name:u.Name||''};players[u.UserUid].cnt++;}
      }
    }catch(e){}
  }
  var sel=document.getElementById('uidSelect');
  sel.innerHTML='';
  var uids=Object.keys(players);
  if(!uids.length){sel.innerHTML='<option value="">未检测到玩家</option>';return;}
  var sorted=uids.sort(function(a,b){return players[b].cnt-players[a].cnt});
  for(var k=0;k<Math.min(sorted.length,5);k++){
    var uid=sorted[k];
    sel.innerHTML+='<option value="'+uid+'">'+players[uid].name+' ('+players[uid].cnt+'场) - '+uid.slice(-6)+'</option>';
  }
  sel.value=sorted[0];
  myUid=sorted[0];
}
function onUidChange(){
  myUid=document.getElementById('uidSelect').value;
  if(myUid)setTimeout(parseLog,100);
}
function lastBid(pl){var bids=[];(pl||[]).forEach(function(p){var r=typeof p.Round==='number'?p.Round:0;bids.push({r:r,v:p.ItemCidOrPrice||0});});bids.sort(function(a,b){return a.r-b.r});return bids.length?bids[bids.length-1].v:0;}

function parseLog(){
  if(!window.logContent){alert('请先拖入 Player.log');return}
  myUid=document.getElementById('uidSelect').value;
  if(!myUid){alert('未检测到玩家，请确认日志文件正确');return}
  var cutoffDate=document.getElementById('dateInput').value;
  var cutoffTs=cutoffDate?Math.floor(new Date(cutoffDate+'T23:00:00+08:00').getTime()/1000):0;
  document.getElementById('meta').textContent='解析中...';
  var text=window.logContent;
  allGames=[];
  var seen={};
  function pushGame(mapId,winUid,ts,rounds,isWin,finalBid,wFinal,wName,itemsUsed,itemCost,containerVal,unpriced){
    var key=mapId+'|'+(isWin?finalBid:wFinal)+'|'+Math.floor(ts/60)+'|'+(isWin?'self':wName);
    if(seen[key])return false; seen[key]=true;
    var ticket=getTicket(mapId);
    var myBase=isWin?(containerVal-finalBid-ticket-itemCost):(-ticket-itemCost);
    var wBase=containerVal-wFinal-ticket;
    var dividend=(wBase<=-10000)?Math.floor(Math.abs(wBase)*0.1):0;
    var myProfit=myBase+dividend;
    var dispProfit=containerVal-wFinal-ticket;
    var dt=new Date(ts*1000); dt=new Date(dt.getTime()+(dt.getTimezoneOffset()+480)*60000);
    var ts2=('0'+(dt.getMonth()+1)).slice(-2)+'/'+('0'+dt.getDate()).slice(-2)+' '+('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
    allGames.push({time:ts2,ts:ts,mapId:mapId,mapName:MAPS[mapId]||('地图'+mapId),rounds:rounds,isWin:isWin,finalBid:finalBid,wFinal:wFinal,itemsUsed:itemsUsed,itemCost:itemCost,ticket:ticket,actualValue:containerVal,myProfit:myProfit,dispProfit:dispProfit,winnerName:isWin?'(你)':wName, unpriced:unpriced});
    return true;
  }
  // ---- SOURCE 1: S2C_89 history (authoritative full history; final price = LastPrice) ----
  var mi=text.indexOf('(S2C_89_get_game_log_list)');
  if(mi>=0){
    var s=text.indexOf('{',mi), depth=0,i=s;
    for(;i<text.length;i++){var c=text[i];if(c==='{')depth++;else if(c==='}'){depth--;if(depth===0)break;}}
    try{
      var list=JSON.parse(text.substring(s,i+1)).GameLogList||[];
      for(var gi=0;gi<list.length;gi++){
        var g=list[gi];
        var mapId=g.MapId, winUid=g.WinUserUid||'', isWin=(winUid===myUid);
        var ts=parseInt(g.GameOverTime||'0');
        if(cutoffTs && ts<cutoffTs)continue;
        var users=g.LogGameUserList||[];
        var my=null; for(var ui=0;ui<users.length;ui++){if(users[ui].UserUid===myUid){my=users[ui];break;}}
        if(!my)continue;
        var rnd=g.Round, rounds;
        if(rnd!=null)rounds=rnd+1; else{var rn=[];(my.PriceLog||[]).forEach(function(p){rn.push(typeof p.Round==='number'?p.Round:0)});rounds=rn.length?Math.max.apply(null,rn)+2:(my.PriceLog||[]).length;}
        var finalBid=my.LastPrice||0;
        var itemsUsed=[],itemCost=0;
        (my.UseItemLog||[]).forEach(function(it){var r=typeof it.Round==='number'?it.Round+1:1;var c=String(it.ItemCidOrPrice||'');var cost=ITEM_COST[c]||0;itemCost+=cost;itemsUsed.push({r:r,name:(ITEMS[c]||{n:'?'}).n,cost:cost});});
        itemsUsed.sort(function(a,b){return a.r-b.r});
        var containerVal=0,unpriced=0;
        (g.StockItemList||[]).forEach(function(cid){var cs=String(cid);var info=ITEMS[cs];if(info){containerVal+=info.p;}else{unpriced++;}});
        var w=null; for(var wi=0;wi<users.length;wi++){if(users[wi].UserUid===winUid){w=users[wi];break;}}
        var wFinal=w?(w.LastPrice||0):0, wName=w?(w.Name||'?'):'?';
        pushGame(mapId,winUid,ts,rounds,isWin,finalBid,wFinal,wName,itemsUsed,itemCost,containerVal,unpriced);
      }
    }catch(e){}
  }
  // ---- SOURCE 2: S2C45 real-time game-over (covers newest games not yet in history) ----
  var p=text.indexOf('(S2C_45_game_over_notify){');
  while(p>=0){
    var s2=text.indexOf('{',p), depth2=0, j=s2;
    for(;j<text.length;j++){var c2=text[j];if(c2==='{')depth2++;else if(c2==='}'){depth2--;if(depth2===0)break;}}
    try{
      var d=JSON.parse(text.substring(s2,j+1));
      var gd=d.GameData||{};
      var winUid2=d.WinUserUid||'', mapId2=gd.MapId, ts2=parseInt(gd.ServerTime||'0');
      if(cutoffTs && ts2<cutoffTs){p=text.indexOf('(S2C_45_game_over_notify){',j);continue;}
      var isWin2=(winUid2===myUid);
      var users2=gd.UserLog||[];
      var my2=null; for(var u2=0;u2<users2.length;u2++){if(users2[u2].UserUid===myUid){my2=users2[u2];break;}}
      if(!my2){p=text.indexOf('(S2C_45_game_over_notify){',j);continue;}
      var rnd2=gd.Round, rounds2;
      if(rnd2!=null)rounds2=rnd2+1; else{var rn2=[];(my2.PriceLog||[]).forEach(function(pp){rn2.push(typeof pp.Round==='number'?pp.Round:0)});rounds2=rn2.length?Math.max.apply(null,rn2)+2:(my2.PriceLog||[]).length;}
      var finalBid2=lastBid(my2.PriceLog);
      var itemsUsed2=[],itemCost2=0;
      (my2.UseItemLog||[]).forEach(function(it){var r=typeof it.Round==='number'?it.Round+1:1;var c=String(it.ItemCidOrPrice||'');var cost=ITEM_COST[c]||0;itemCost2+=cost;itemsUsed2.push({r:r,name:(ITEMS[c]||{n:'?'}).n,cost:cost});});
      itemsUsed2.sort(function(a,b){return a.r-b.r});
      var containerVal2=0,unpriced2=0, uids2={};
      (gd.StockContainer||{}).StockBoxes&&(gd.StockContainer.StockBoxes).forEach(function(box){var item=box.Item||{};var cid=item.Cid;if(!cid)return;if(item.CanTrade===false)return;var iu=item.Uid;if(iu&&uids2[iu])return;if(iu)uids2[iu]=true;var cs=String(cid);var info=ITEMS[cs];if(info){containerVal2+=info.p;}else{unpriced2++;}});
      var w2=null; for(var wj=0;wj<users2.length;wj++){if(users2[wj].UserUid===winUid2){w2=users2[wj];break;}}
      var wFinal2=w2?lastBid(w2.PriceLog):0, wName2=w2?(w2.Name||'?'):'?';
      pushGame(mapId2,winUid2,ts2,rounds2,isWin2,finalBid2,wFinal2,wName2,itemsUsed2,itemCost2,containerVal2,unpriced2);
    }catch(e){}
    p=text.indexOf('(S2C_45_game_over_notify){',j);
  }
  allGames.sort(function(a,b){return b.ts-a.ts});
  var meta=document.getElementById('meta');
  if(!allGames.length){meta.textContent='0 场 - 请确认数据正确';document.getElementById('resultArea').classList.add('hidden');alert('未找到匹配记录');return}
  meta.textContent=allGames.length+' 场 (历史+实时)';
  dz.textContent='已加载 - '+allGames.length+' 场对局';
  renderTable();
}

function fmt(n){return n.toLocaleString()}
function renderTable(){
  var tbody=document.getElementById('tableBody');
  if(!allGames.length){tbody.innerHTML='<tr><td colspan="9" class="nodata">没有匹配记录</td></tr>';return}
  var h='';
  allGames.forEach(function(g){
    var rc=g.isWin?(g.dispProfit>0?'win-row':'lose-row'):'';
    var wn=g.isWin?'<span class="winner-me">'+g.winnerName+'</span>':'<span class="winner-other">'+g.winnerName+'</span>';
    var ip=g.itemsUsed.map(function(i){return 'R'+i.r+': '+i.name}).join(' -> ')||'--';
    var dp=g.dispProfit;
    var ps=dp>0?'<span class="profit-pos">+'+fmt(dp)+'</span>':(dp===0?'<span class="profit-zero">0</span>':'<span class="profit-neg">'+fmt(dp)+'</span>');
    h+='<tr class="'+rc+'" data-win="'+(g.isWin?'yes':'no')+'" data-profit="'+g.myProfit+'" data-val="'+g.actualValue+'" data-bid="'+g.finalBid+'" data-icost="'+g.itemCost+'" data-ticket="'+g.ticket+'" data-map="'+g.mapId+'"><td>'+g.time+'</td><td>'+g.rounds+'</td><td>'+g.mapName+'</td><td>'+wn+'</td><td style="text-align:left"><span class="bid-detail">'+ip+'</span></td><td>'+fmt(g.finalBid)+'</td><td>'+fmt(g.wFinal||0)+'</td><td>'+fmt(g.actualValue)+'</td><td>'+ps+'</td></tr>';
  });
  tbody.innerHTML=h;
  document.getElementById('resultArea').classList.remove('hidden');
  document.getElementById('limitN').max=allGames.length;
  document.getElementById('footerInfo').textContent='盈亏 = 拍到价值 - 出价 - 道具 - 门票 + 分红 | '+new Date().toLocaleString();
  showAll();
}

function updateSummary(rows){
  var n=0,w=0,pw=0,profit=0,val=0,bid=0,icost=0,tick=0;
  var ticketMap={}; // per-series
  var ticketNames={21:'快递(21xx)',22:'仓库(22xx)',23:'集装箱(23xx)',24:'别墅(24xx)',25:'残骸(25xx)',26:'拍卖会(26xx)',56:'竞拍之巅(56xx)'};
  rows.forEach(function(r){n++;if(r.dataset.win==='yes'){w++;val+=parseInt(r.dataset.val)||0;bid+=parseInt(r.dataset.bid)||0;if(parseInt(r.dataset.profit)||0>0){pw++}}icost+=parseInt(r.dataset.icost)||0;var t=parseInt(r.dataset.ticket)||0;tick+=t;var prefix=normalizeMapPrefix(parseInt(r.dataset.map));ticketMap[prefix]=(ticketMap[prefix]||0)+t;profit+=parseInt(r.dataset.profit)||0});
  var div=profit-(val-bid-icost-tick);

  // Summary cards
  document.getElementById('sumN').textContent=n;
  document.getElementById('sumW').textContent=w;
  document.getElementById('sumL').textContent=n-w;
  document.getElementById('sumRate').textContent=rateModeStandalone==='profit'?(w>0?(pw/w*100).toFixed(1)+'%':'N/A'):(n>0?(w/n*100).toFixed(1)+'%':'N/A');
  var p=profit;
  document.getElementById('sumProfit').textContent=(p>=0?'+':'')+fmt(p);
  var pc=document.getElementById('profitCard');pc.classList.toggle('green',p>=0);pc.classList.toggle('red',p<0);

  // Detail popup
  document.getElementById('dW').textContent=w;document.getElementById('dVal').textContent='+'+fmt(val);
  document.getElementById('dBidW').textContent=w;document.getElementById('dBid').textContent='-'+fmt(bid);
  document.getElementById('dItemN').textContent=n;document.getElementById('dItem').textContent='-'+fmt(icost);

  // Ticket breakdown with game counts per series
  var ticketCount={};
  rows.forEach(function(r){var pr=normalizeMapPrefix(parseInt(r.dataset.map));ticketCount[pr]=(ticketCount[pr]||0)+1});
  var td='';
  var prefixes=[21,22,23,24,25,26,56];
  for(var i=0;i<prefixes.length;i++){
    var pr=prefixes[i],cnt=ticketCount[pr]||0,amt=ticketMap[pr]||0;
    if(cnt>0) td+='<div style=\"display:flex;justify-content:space-between;padding:2px 0\"><span>'+ticketNames[pr]+' ×'+cnt+'局</span><span class=\"neg\">-'+fmt(amt)+'</span></div>';
  }
  if(!td) td='<span>-</span>';
  document.getElementById('dTicketDetail').innerHTML=td;
  document.getElementById('dTick').textContent='-'+fmt(tick);
  document.getElementById('dDiv').textContent=(div>=0?'+':'')+fmt(div);
  document.getElementById('dTotal').textContent=(p>=0?'+':'')+fmt(p);
  document.getElementById('dTotal').className=p>=0?'pos':'neg';
}

function getActivePrefixes(){
  var chips=document.querySelectorAll('.map-chip.active');
  var pfx=[];
  chips.forEach(function(c){pfx.push(parseInt(c.dataset.mprefix))});
  return pfx;
}
function toggleMap(chip){
  chip.classList.toggle('active');
  applyLimit();
}
function applyLimit(){
  var n=parseInt(document.getElementById('limitN').value)||allGames.length;
  var pfx=getActivePrefixes();
  var rows=document.querySelectorAll('tr[data-win]');
  var visible=[],count=0;
  rows.forEach(function(r){
    if(mode==='win'&&r.dataset.win==='no'){r.classList.add('hidden');return}
    var mp=normalizeMapPrefix(parseInt(r.dataset.map));
    if(pfx.indexOf(mp)===-1){r.classList.add('hidden');return}
    count++;
    if(count<=n){r.classList.remove('hidden');visible.push(r)}else{r.classList.add('hidden')}
  });
  updateSummary(visible);
}

function showAll(){mode='all';document.querySelector('table').classList.add('show-bg');document.getElementById('btnAll').classList.add('active');document.getElementById('btnWin').classList.remove('active');applyLimit()}
function showWin(){mode='win';document.querySelector('table').classList.remove('show-bg');document.getElementById('btnAll').classList.remove('active');document.getElementById('btnWin').classList.add('active');applyLimit()}
function toggleDetail(){document.getElementById('overlay').classList.toggle('show')}
</script>
